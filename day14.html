<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Todo-лист</title>
    <link rel="stylesheet" href="day14.css">
</head>
<body>
    <div class="app">
        <h1>Мои дела</h1>
        <p>Планируй день с легкостью</p>

        <form id="form">
            <input type="text" id="textInput" placeholder="Что сделать?">
            <button type="submit" id="buttonAdd">Добавить</button>
        </form>

        <div id="todoList"></div>
        <p id="availability">Пока дел нет</p>
        <hr>
        <button id="clearBtn" type="button">Очистить всё</button>
    </div>
    <script src="day14.js"></script>
</body>
</html>
